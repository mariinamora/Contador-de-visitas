<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contador de visitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1d1a3c;--navy2:#2b2757;--navy3:#3a3670;--blue:#93c0e3;--blue-d:#5d9acb;--sky:#e8f2fa;--ink:#262445;--mut:#5a5880;
--sans:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;font-family:var(--sans);color:var(--ink);padding:12px}
.card{position:relative;overflow:hidden;max-width:1100px;margin:0 auto;border-radius:28px;background:var(--navy);color:#fff;padding:clamp(22px,4vw,40px) clamp(18px,4vw,44px);display:grid;gap:clamp(14px,2.4vw,22px);justify-items:start}
.card::before,.card::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.card::before{width:min(46vw,360px);aspect-ratio:1;right:-9%;top:-45%;background:var(--navy3);opacity:.55}
.card::after{width:min(26vw,190px);aspect-ratio:1;right:14%;bottom:-38%;background:var(--blue);opacity:.22}
.kick{position:relative;z-index:1;display:inline-flex;align-items:center;gap:.8rem;margin:0;font-weight:800;font-size:clamp(.74rem,2.2vw,.9rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.kick i{display:inline-block;width:2.2rem;height:4px;border-radius:4px;background:var(--blue-d)}
.odo{position:relative;z-index:1;display:flex;gap:clamp(5px,1.2vw,12px);font-size:clamp(2.6rem,12.5vw,7rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.dg{position:relative;width:.74em;height:1.2em;overflow:hidden;border-radius:.16em;background:var(--navy2);box-shadow:inset 0 0 0 2px rgba(147,192,227,.18)}
.dg::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(29,26,60,.55);z-index:2}
.rl{display:block;will-change:transform}
.rl span{display:block;height:1.2em;line-height:1.2em;text-align:center;color:var(--sky)}
.dg.z .rl span{color:var(--navy3)}
.msg{position:relative;z-index:1;margin:0;font-size:clamp(1rem,3vw,1.35rem);font-weight:600;color:#dbe9f5;min-height:1.6em}
.msg b{color:#fff;font-weight:800}
.sub{position:relative;z-index:1;margin:0;font-size:.82rem;color:var(--blue);opacity:.85}
.thanks{position:relative;z-index:1;display:flex;align-items:center;gap:.6rem;margin:0;font-weight:700;font-size:clamp(.95rem,2.8vw,1.15rem);color:var(--sky)}
.heart{width:1.9em;height:1.9em;flex:none;opacity:0;transform:scale(.2);filter:drop-shadow(0 4px 10px rgba(238,91,102,.55))}
.heart.on{animation:pop .8s cubic-bezier(.3,1.6,.5,1) forwards,latir 1.5s ease-in-out .9s infinite}
.fl{position:absolute;bottom:16%;z-index:3;pointer-events:none;width:var(--s);height:var(--s);opacity:0;animation:vuela var(--t) ease-out forwards}
.fl svg{display:block;width:100%;height:100%}
@keyframes pop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
@keyframes latir{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(1)}42%{transform:scale(1.14)}70%{transform:scale(1)}}
@keyframes vuela{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-190px) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.heart,.heart.on{animation:none;opacity:1;transform:none}}
.err .odo{opacity:.5}.err .thanks{display:none}
@media(prefers-reduced-motion:reduce){.rl{transition:none!important}}
</style>
</head>
<body>
<section class="card" id="card" aria-label="Contador de visitas">
  <p class="kick"><i></i>Visitas a la web del cole</p>
  <div class="odo" id="odo" role="img" aria-label="Visitas: cargando"></div>
  <p class="msg" id="msg">&nbsp;</p>
  <p class="thanks" id="thanks"><svg class="heart" id="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ee5b66" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>Gracias por tu visita. ¡Nos hace mucha ilusión!</span></p>
</section>
<script>
(function(){
  /* ===== AJUSTES ===== */
  var NS='ceip-nsra-asuncion';      // nombre del grupo (no lo cambies o empezará de 0)
  var KEY='visitas-web';             // nombre del contador
  var MIN_DIGITOS=4;                 // mínimo de casillas
  var DEMO=null;                     // número de prueba (déjalo en null en la web real)
  /* ==================== */

  var q=new URLSearchParams(location.search).get('demo'); if(q&&!isNaN(+q))DEMO=+q;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var odo=document.getElementById('odo'),msg=document.getElementById('msg'),card=document.getElementById('card');
  var H=1.2; // alto de cada cifra en em

  function st(k,v){try{if(v===undefined)return window.localStorage.getItem(k);window.localStorage.setItem(k,v)}catch(e){return null}}
  function ss(k,v){try{if(v===undefined)return window.sessionStorage.getItem(k);window.sessionStorage.setItem(k,v)}catch(e){return null}}

  var providers=[
    {hit:'https://abacus.jasoncameron.dev/hit/'+NS+'/'+KEY, get:'https://abacus.jasoncameron.dev/get/'+NS+'/'+KEY, val:function(j){return j.value}},
    {hit:'https://api.counterapi.dev/v1/'+NS+'/'+KEY+'/up', get:'https://api.counterapi.dev/v1/'+NS+'/'+KEY, val:function(j){return j.count}}
  ];
  function getJSON(url){
    var c=window.AbortController?new AbortController():null,t=setTimeout(function(){c&&c.abort()},7000);
    return fetch(url,{cache:'no-store',signal:c?c.signal:undefined}).then(function(r){clearTimeout(t);if(!r.ok)throw new Error('http');return r.json()});
  }
  function obtener(contar){
    var i=0;
    function next(){
      if(i>=providers.length)return Promise.reject(new Error('sin servicio'));
      var p=providers[i++];
      return getJSON(contar?p.hit:p.get).then(function(j){var v=Number(p.val(j));if(!isFinite(v))throw new Error('nan');return v}).catch(next);
    }
    return next();
  }

  function pad(n,len){var s=String(Math.max(0,Math.floor(n)));while(s.length<len)s='0'+s;return s}
  function build(len){
    odo.innerHTML='';
    var cols=[];
    for(var i=0;i<len;i++){
      var d=document.createElement('div'),r=document.createElement('div'),h='';
      d.className='dg';r.className='rl';
      for(var k=0;k<40;k++)h+='<span>'+(k%10)+'</span>';
      r.innerHTML=h;d.appendChild(r);odo.appendChild(d);cols.push({d:d,r:r});
    }
    return cols;
  }
  function pos(r,k,anim,ms,delay){
    r.style.transition=anim?'transform '+ms+'ms cubic-bezier(.2,.8,.2,1) '+delay+'ms':'none';
    r.style.transform='translateY(-'+(k*H)+'em)';
  }
  function mostrar(prev,val){
    var len=Math.max(String(val).length,String(prev).length,MIN_DIGITOS);
    var cols=build(len),a=pad(prev,len),b=pad(val,len),first=-1,i;
    for(i=0;i<len;i++){if(a[i]!==b[i]){first=i;break}}
    var firstNZ=b.search(/[1-9]/); if(firstNZ<0)firstNZ=len-1;
    for(i=0;i<len;i++){
      cols[i].d.className='dg'+(i<firstNZ?' z':'');
      pos(cols[i].r,+a[i],false);
    }
    odo.setAttribute('aria-label','Visitas: '+val.toLocaleString('es-ES'));
    if(reduce||first<0){for(i=0;i<len;i++)pos(cols[i].r,+b[i],false);return}
    void odo.offsetWidth;
    setTimeout(function(){
      for(i=0;i<len;i++){
        if(i<first){pos(cols[i].r,+a[i],false);continue}
        pos(cols[i].r,20+ +b[i],true,1700+(len-1-i)*0,(i-first)*90);
      }
    },350);
  }


  var heart=document.getElementById('heart');
  function gracias(){
    if(!heart||card.classList.contains('err'))return;
    heart.classList.add('on');
    if(reduce)return;
    var hr=card.getBoundingClientRect();
    for(var i=0;i<9;i++){
      var f=document.createElement('span'),sz=14+Math.random()*16;
      f.className='fl';
      f.style.cssText='left:'+(8+Math.random()*70)+'%;--s:'+sz+'px;--dx:'+((Math.random()*80-40))+'px;--t:'+(2.2+Math.random()*1.6)+'s;animation-delay:'+(i*0.18)+'s';
      f.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="'+(i%2?'#ee5b66':'#93c0e3')+'" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
      f.addEventListener('animationend',function(e){e.currentTarget.remove()});
      card.appendChild(f);
    }
  }
  function fin(prev,val,contado){
    mostrar(prev,val);
    setTimeout(gracias,reduce?0:(prev===val?500:2500));
    var n=val.toLocaleString('es-ES');
    msg.innerHTML=contado?'Tú eres la visita número <b>'+n+'</b>':'Ya van <b>'+n+'</b> visitas. ¡Gracias por volver!';
  }

  if(DEMO!==null){
    var antes=Number(st('demo_last'))||Math.max(0,DEMO-23);
    st('demo_last',String(DEMO));
    fin(antes,DEMO,true);return;
  }

  var contado=ss('contado')==='1';
  var prev=Number(st('ultimo'))||0;
  obtener(!contado).then(function(v){
    if(!contado)ss('contado','1');
    st('ultimo',String(v));
    fin(prev,v,!contado);
  }).catch(function(){
    card.classList.add('err');
    mostrar(prev,prev);
    msg.textContent=prev?'No hemos podido actualizar el contador ahora mismo.':'El contador no está disponible ahora mismo.';
  });
})();
</script>
</body>
</html>
